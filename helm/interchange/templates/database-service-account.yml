{{- if and .Values.database.enabled .Values.database.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "database.serviceAccount.name is required when database.serviceAccount.create is true" .Values.database.serviceAccount.name | quote }}
  labels:
    app: {{ .Chart.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    component: database
    release: {{ .Release.Name }}
  {{ with .Values.database.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{ end }}
{{- end }}
