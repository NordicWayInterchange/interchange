{{ if .Values.admin_frontend.enabled }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}-admin-frontend
  labels:
    app: {{ .Chart.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    component: admin-frontend
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.admin_server.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: admin-frontend
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: admin-frontend
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: admin-frontend
          image: "{{ .Values.admin_frontend.image.repository }}:{{ .Values.admin_frontend.image.tag }}"
          env:
            - name: PFX_KEY_FILENAME
              value: {{ .Values.admin_frontend.keystore_file_name }}
            - name: PFX_PASSPHRASE
              value: {{ .Values.admin_keystore_password | quote }}
            - name: INTERCHANGE_URI
              value: "https://{{ .Release.Name }}-admin-server:{{ .Values.self.admin_port }}/admin/"
            - name: INTERCHANGE_PREFIX
              value: {{ .Values.admin_frontend.generated_username_prefix }}
            - name: NEXTAUTH_SECRET
              value: {{ .Values.admin_nextauth_secret | quote }}
            - name: AUTH0_CLIENT_ID
              value: {{ .Values.admin_auth0_client_id | quote }}
            - name: AUTH0_CLIENT_SECRET
              value: {{ .Values.admin_auth0_client_secret | quote }}
            - name: AUTH0_ISSUER
              value: {{ .Values.admin_frontend.admin_auth0_issuer | quote }}
            - name: NEXTAUTH_URL
              value: {{ .Values.admin_frontend.home_url | quote }}

          volumeMounts:
            - mountPath: /app/secret
              name: admin-frontend-secret
          ports:
            - name: admin-frontend
              containerPort: 3000
          livenessProbe:
            httpGet:
              port: 3000
              path: /login
            initialDelaySeconds: 300
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              port: 3000
              path: /login
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
      volumes:
        - name: admin-frontend-secret
          secret:
            secretName: admin-frontend-secret
  {{- end }}