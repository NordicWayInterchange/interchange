{{ if .Values.napcore_frontend.enabled }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}-napcore-frontend
  labels:
    app: {{ .Chart.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    component: napcore-frontend
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.napcore_frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: napcore-frontend
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: napcore-frontend
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: napcore-frontend
          image: "{{ .Values.napcore_frontend.image.repository }}:{{ .Values.napcore_frontend.image.tag }}"
          env:
            - name: PFX_KEY_FILENAME
              value: {{ .Values.napcore_frontend.keystore_file_name | quote }}
            - name: PFX_PASSPHRASE
              value: {{ .Values.napcore_client_keystore_password | quote }}
            - name: INTERCHANGE_URI
              value: "https://{{ .Release.Name }}-napcore-server:{{ .Values.self.nap_provider_port}}/nap/"
            - name: INTERCHANGE_PREFIX
              value: {{ .Values.napcore_frontend.generated_username_prefix }}
            - name: NEXTAUTH_SECRET
              value: {{ .Values.napcore_nextauth_secret | trim | quote }}
            - name: NEXTAUTH_URL
              value: {{ .Values.napcore_frontend.home_url | quote }}
{{- if .Values.napcore_frontend.keycloak.enabled }}
            - name: USE_KEYCLOAK
              value: true
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.napcore_frontend.keycloak.client_id }}
            - name: INTERNAL_KEYCLOAK_URL
              value: "https://{{ .Release.Name }}-keycloak:8443"
            - name: KEYCLOAK_REALM
              value: {{ .Values.napcore_frontend.keycloak.realm }}
            - name: KEYCLOAK_CLIENT_SECRET
              value: {{ .Values.keycloak_client_secret | quote }}
            - name: EXTERNAL_KEYCLOAK_URL
              value: {{.Values.napcore_frontend.keycloak.external_keycloak_url }}
{{- else }}
            - name: AUTH0_CLIENT_ID
              value: {{ .Values.napcore_auth0_client_id | trim | quote }}
            - name: AUTH0_CLIENT_SECRET
              value: {{ .Values.napcore_auth0_client_secret | trim | quote }}
            - name: AUTH0_ISSUER
              value: {{ .Values.napcore_frontend.napcore_auth0_issuer | quote }}
{{- end }}
          volumeMounts:
            - mountPath: /app/secret
              name: napcore-frontend-secret
          ports:
            - name: nap-frontend
              containerPort: 3000
          livenessProbe:
            httpGet:
              port: 3000
              path: /login
            initialDelaySeconds: 300
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              port: 3000
              path: /login
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
      volumes:
        - name: napcore-frontend-secret
          secret:
            secretName: napcore-frontend-secret
{{- end }}