{{- if and .Values.qpid.enabled .Values.qpid.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "qpid.serviceAccount.name is required when qpid.serviceAccount.create is true" .Values.qpid.serviceAccount.name | quote }}
  labels:
    app: {{ .Chart.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    component: qpid
    release: {{ .Release.Name }}
  {{ with .Values.qpid.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{ end }}
{{- end }}
