{{- if and .Values.qpid.enabled (not .Values.qpid.internal_secret.externally_managed) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "must provide .Values.qpid.internal_secrets_name" .Values.qpid.internal_secrets_name }}
type: Opaque
data:
  {{ .Values.qpid.internal_key_store_name }}: {{ .Values.internal_keystore }}

{{- end }}
