{{- if .Values.qpid.enabled }}
{{- $tlsSource := .Values.qpid.tls.source | default "secret" }}
{{- if not (has $tlsSource (list "secret" "csi")) }}
{{- fail "qpid.tls.source must be one of: secret, csi" }}
{{- end }}
{{- $internalTlsSource := .Values.qpid.internal_secret.source | default "secret" }}
{{- if not (has $internalTlsSource (list "secret" "csi")) }}
{{- fail "qpid.internal_secret.source must be one of: secret, csi" }}
{{- end }}
{{- if and (eq $internalTlsSource "csi") (not .Values.qpid.internal_secret.externally_managed) }}
{{- fail "qpid.internal_secret.externally_managed must be true when qpid.internal_secret.source is csi" }}
{{- end }}
{{- $credentialsSource := .Values.qpid.credentials.source | default "values" }}
{{- if not (has $credentialsSource (list "values" "secret")) }}
{{- fail "qpid.credentials.source must be one of: values, secret" }}
{{- end }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}-qpid
  labels:
    app: {{ .Chart.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    component: qpid
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.qpid.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: qpid
      release: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/qpid-config.yml") . | sha256sum }}
      labels:
        app: {{ .Chart.Name }}
        component: qpid
        release: {{ .Release.Name }}
        {{- with .Values.qpid.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.qpid.serviceAccount.name }}
      serviceAccountName: {{ .Values.qpid.serviceAccount.name | quote }}
      {{- end }}
      securityContext:
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: qpid
          image: "{{ .Values.qpid.image.repository }}:{{ .Values.qpid.image.tag}}"
          ports:
            - name: amqp
              containerPort: 5672
            - name: amqps
              containerPort: 5671
            - name: http-qpid-gui
              containerPort: 8080
            - name: https-qpid-rest
              containerPort: 443
          env:
            - name: KEY_STORE
              value: {{ .Values.self.secret_mount_path }}{{ .Values.self.key_store }}
            {{- if eq $credentialsSource "secret" }}
            - name: KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "qpid.credentials.secret_name is required when qpid.credentials.source is secret" .Values.qpid.credentials.secret_name | quote }}
                  key: {{ .Values.qpid.credentials.key_store_password_key | quote }}
            {{- else }}
            - name: KEY_STORE_PASSWORD
              value: {{ .Values.key_store_password | quote }}
            {{- end }}
            - name: TRUST_STORE
              value: {{ .Values.self.secret_mount_path }}{{ .Values.self.trust_store }}
            {{- if eq $credentialsSource "secret" }}
            - name: TRUST_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "qpid.credentials.secret_name is required when qpid.credentials.source is secret" .Values.qpid.credentials.secret_name | quote }}
                  key: {{ .Values.qpid.credentials.trust_store_password_key | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "qpid.credentials.secret_name is required when qpid.credentials.source is secret" .Values.qpid.credentials.secret_name | quote }}
                  key: {{ .Values.qpid.credentials.admin_password_key | quote }}
            {{- else }}
            - name: TRUST_STORE_PASSWORD
              value: {{ .Values.trust_store_password | quote }}
            {{- end }}
            - name: GROUPS_FILE
              value: /qpid-broker-j/work/groups
            - name: INTERNAL_KEY_STORE
              value: {{ .Values.qpid.internal_keys_path }}{{ .Values.qpid.internal_key_store_name }}
            {{- if .Values.qpid.internal_secret.externally_managed }}
            - name: INTERNAL_KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "must provide .Values.qpid.internal_secrets_name" .Values.qpid.internal_secrets_name }}
                  key: {{ .Values.qpid.internal_secret.key_store_password_key }}
            - name: INTERNAL_TRUST_STORE
              value: {{ .Values.qpid.internal_keys_path }}{{ .Values.qpid.internal_secret.trust_store_name }}
            - name: INTERNAL_TRUST_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "must provide .Values.qpid.internal_secrets_name" .Values.qpid.internal_secrets_name }}
                  key: {{ .Values.qpid.internal_secret.trust_store_password_key }}
            {{- else }}
            - name: INTERNAL_KEY_STORE_PASSWORD
              value: {{ .Values.internal_key_store_password | quote }}
            {{- end }}
        {{- if .Values.qpid.java_mem }}
            - name: QPID_JAVA_MEM
              value: {{ .Values.qpid.java_mem }}
        {{- end }}
          volumeMounts:
            - name: secure
              mountPath: {{ .Values.self.secret_mount_path | quote }}
            - name: internal-keys
              mountPath: {{ .Values.qpid.internal_keys_path | quote }}
              readOnly: true
            - name: storage
              mountPath: /qpid-broker-j/work
            - name: config
              mountPath: /qpid-broker-j/work-override
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-qpid
        - name: secure
          {{- if eq $tlsSource "csi" }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required "qpid.tls.csi.secret_provider_class is required when qpid.tls.source is csi" .Values.qpid.tls.csi.secret_provider_class | quote }}
          {{- else }}
          secret:
            secretName: {{ required "must provide .Values.self.tls_secret_name" .Values.self.tls_secret_name }}
          {{- end }}
        - name: internal-keys
          {{- if eq $internalTlsSource "csi" }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required "qpid.internal_secret.csi.secret_provider_class is required when qpid.internal_secret.source is csi" .Values.qpid.internal_secret.csi.secret_provider_class | quote }}
          {{- else }}
          secret:
            secretName: {{ required "must provide .Values.qpid.internal_secrets_name" .Values.qpid.internal_secrets_name }}
          {{- end }}
        - name: storage
      {{- if .Values.qpid.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-qpid
      {{- else }}
          emptyDir: {}
      {{- end }}
  {{- end }}
