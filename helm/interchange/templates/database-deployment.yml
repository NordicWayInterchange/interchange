{{- if .Values.database.enabled }}
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}-database
  labels:
    app: {{ .Chart.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    component: database
    release: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-database
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: database
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: database
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag}}"
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres_user | quote }}
            {{- if .Values.database.password_secret.enabled }}
            - name: POSTGRES_PASSWORD_FILE
              value: {{ printf "%s/password" (required "must provide .Values.database.password_secret.mount_path when database.password_secret.enabled is true" .Values.database.password_secret.mount_path) | quote }}
            {{- else }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres_password | quote }}
            {{- end }}
            - name: POSTGRES_DB
              value: {{ .Values.database.postgres_db | quote }}
            - name: PGDATA
              value: {{ .Values.database.pgdata | quote }}
          ports:
            - name: db
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if .Values.database.password_secret.enabled }}
            - name: database-password
              mountPath: {{ required "must provide .Values.database.password_secret.mount_path when database.password_secret.enabled is true" .Values.database.password_secret.mount_path | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: data
      {{- if .Values.database.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-database
      {{- else }}
          emptyDir: {}
      {{- end -}}
      {{- if .Values.database.password_secret.enabled }}
        - name: database-password
          secret:
            secretName: {{ required "must provide .Values.database.password_secret.secret_name when database.password_secret.enabled is true" .Values.database.password_secret.secret_name | quote }}
            items:
              - key: {{ required "must provide .Values.database.password_secret.secret_key when database.password_secret.enabled is true" .Values.database.password_secret.secret_key | quote }}
                path: password
      {{- end }}
  {{- end }}
