{{- if .Values.database.enabled }}
{{- $passwordSource := .Values.database.password.source | default "environment" }}
{{- if not (has $passwordSource (list "environment" "secret" "csi")) }}
{{- fail "database.password.source must be one of: environment, secret, csi" }}
{{- end }}
{{- $passwordMountPath := "" }}
{{- if ne $passwordSource "environment" }}
{{- $passwordMountPath = required "database.password.mount_path is required when database.password.source is secret or csi" .Values.database.password.mount_path }}
{{- end }}
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}-database
  labels:
    app: {{ .Chart.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    component: database
    release: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-database
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: database
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: database
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag}}"
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres_user | quote }}
            {{- if ne $passwordSource "environment" }}
            - name: POSTGRES_PASSWORD_FILE
              value: {{ printf "%s/password" $passwordMountPath | quote }}
            {{- else }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres_password | quote }}
            {{- end }}
            - name: POSTGRES_DB
              value: {{ .Values.database.postgres_db | quote }}
            - name: PGDATA
              value: {{ .Values.database.pgdata | quote }}
          ports:
            - name: db
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if ne $passwordSource "environment" }}
            - name: database-password
              mountPath: {{ $passwordMountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: data
      {{- if .Values.database.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-database
      {{- else }}
          emptyDir: {}
      {{- end }}
      {{- if eq $passwordSource "secret" }}
        - name: database-password
          secret:
            secretName: {{ required "database.password.secret.name is required when database.password.source is secret" .Values.database.password.secret.name | quote }}
            items:
              - key: {{ required "database.password.secret.key is required when database.password.source is secret" .Values.database.password.secret.key | quote }}
                path: password
      {{- else if eq $passwordSource "csi" }}
        - name: database-password
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required "database.password.csi.secret_provider_class is required when database.password.source is csi" .Values.database.password.csi.secret_provider_class | quote }}
      {{- end }}
  {{- end }}
