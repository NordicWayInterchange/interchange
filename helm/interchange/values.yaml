static_external_ip: ""
self:                                                               # ------ General node settings ----------------
  control_channel_port: 443                                         # Specify the control channel port  for the Node
  message_channel_port: 5671                                        # Specify the message channel port  for the Node
  secret_mount_path: /jks/keys/                                     # Location of certificates and keys
  service_provider_port: "4141"                                     # Port of the onboarding server REST controller
  nap_provider_port: "4242"                                         # Port of the napcore server REST controller
  nap_name: "nap"                                                   # Name of the napcore user connected to the napcore server
  admin_port: "4343"
  admin_name: "admin.itsinterchange.eu"

  trust_store: truststore.jks
  key_store: keystore.p12
  internal_tls_secret: true #if true, use internal "dev-no" secret. If false, use custom secret name.

database:
  enabled: true # NOTE: Setting this to false removes all database resources including persistence, which might lead to data loss!
  serviceAccount:
    # Create a Kubernetes ServiceAccount for the database pod.
    create: false
    # Required when create is true. When create is false, a non-empty name references an existing account.
    name: ""
    annotations: {}
  # Additional labels for the database pod, such as the Azure Workload Identity opt-in label.
  podLabels: {}
  password:
    # Password source for the PostgreSQL container: environment or csi.
    source: environment
    # Used when source is csi. The password is mounted as "password".
    mount_path: /run/secrets/database
    csi:
      secret_provider_class: ""

qpid:
  enabled: true # NOTE: Setting this to false removes all qpid resources, including services and persistence!
  replicas: 1
  serviceAccount:
    # Create a Kubernetes ServiceAccount for the Qpid pod.
    create: false
    # Required when create is true. A non-empty name references an existing
    # account when create is false.
    name: ""
    annotations: {}
  # Additional labels for the Qpid pod, such as the Azure Workload Identity
  # opt-in label.
  podLabels: {}
  expose_amqps: true
  persistence:
    enabled: false
    storageClassName: standard
    size: 10Gi

  tls:
    # Source for the node TLS keystore and truststore: secret or csi.
    source: secret
    csi:
      secret_provider_class: ""

  credentials:
    # Source for the admin and node TLS passwords: values or secret.
    source: values
    # Used when source is secret. The CSI driver can synchronize this Secret.
    secret_name: ""
    admin_password_key: admin_password
    key_store_password_key: key_store_password
    trust_store_password_key: trust_store_password

  internal_keys_path: /internal_keys/
  internal_secrets_name: qpid-internal-secret
  internal_key_store_name: internal_key_store.p12
  internal_secret:
    # When true, use an externally managed Secret for Qpid's internal HTTPS
    # endpoint.
    externally_managed: false
    # Source for the internal TLS keystore and truststore: secret or csi.
    source: secret
    csi:
      secret_provider_class: ""
    trust_store_name: internal_truststore.jks
    key_store_password_key: key_store_password
    trust_store_password_key: trust_store_password

  memorydump:
    enabled: false

  amqps:
    port: 5671
  http_qpid_gui:
    port: 8080
  https_qpid_rest:
    port: 443

  ## credentials used by the interchange server(s)
  interchange_user: interchange

  ## admin credentials
  admin_user: qpid-admin

admin_server:
  replicas: 1
  enabled: false

message_collector:
  enabled: true
  replicas: 1
  key_store_type: P12
  trust_store_type: JKS

neighbour_discoverer:
  enabled: true
  replicas: 1

neighbour_server:
  enabled: true
  replicas: 1

onboard_server:
  enabled: true
  replicas: 1

routing_configurer:
  enabled: true
  replicas: 1
  internal_tls:
    # Use an externally managed Secret for Qpid HTTPS client authentication.
    enabled: false
    secret_name: ""
    key_store: routing-configurer-internal.p12
    trust_store: routing-configurer-internal-truststore.jks
    key_store_password_key: key_store_password
    trust_store_password_key: trust_store_password

napcore_server:
  replicas: 1
  enabled: false
  mount_path: /jks/signer/

napcore_frontend:
  enabled: false
  certmanager_enabled: false
  keycloak:
    enabled: false

admin_frontend:
  enabled: false
  certmanager_enabled: false

