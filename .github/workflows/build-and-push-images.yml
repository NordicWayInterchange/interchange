name: Build and Push Docker Images

permissions:
  contents: read
  id-token: write

on:
  push:
  workflow_dispatch:
    inputs:
      git-ref:
        required: false
        description: 'Specified commit hash or branch name (Optional)'
jobs:
  validate-helm-chart:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:

      # Checkout the repository to the GitHub Actions runner
      - name: Checkout (Latest)
        uses: actions/checkout@v5
        if: github.event.inputs.git-ref == ''
      - name: Checkout (Custom commit or branch)
        uses: actions/checkout@v5
        if: github.event.inputs.git-ref != ''
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Setup helm
        uses: azure/setup-helm@v4.3.1

      - name: Templating Interchange helm chart
        working-directory: ./helm/interchange
        run: |
          helm template -f example_values.yml .

  build:
    runs-on: ubuntu-latest
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout (Latest)
        uses: actions/checkout@v5
        if: github.event.inputs.git-ref == ''
      - name: Checkout (Custom commit or branch)
        uses: actions/checkout@v5
        if: github.event.inputs.git-ref != ''
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore and save Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven (compile and package, skip tests)
        run: mvn -B package -DskipTests -Dorg.slf4j.simpleLogger.log.org.apache.maven=warn

      - name: Save tags to files
        run: |
          echo "$(git rev-parse --short HEAD)" >> IMAGE_TAG.txt
          echo "$(git rev-parse --abbrev-ref HEAD)" >> BRANCH_TAG.txt

      - name: Persist to workspace
        uses: actions/upload-artifact@v7.0.0
        with:
          name: interchange
          path: ./

  verify:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        shell: bash
    steps:
      - name: Download persisted workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Maven cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run integration tests with Maven (no clean)
        run: mvn -B verify -Dorg.slf4j.simpleLogger.log.org.apache.maven=warn

      - name: Persist verified workspace
        uses: actions/upload-artifact@v7.0.0
        with:
          name: interchange-verified
          path: ./

  push-generated-docs:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/federation-master'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download verified workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange-verified

      - name: Checkout to interchange-swagger-docs
        uses: actions/checkout@v5
        with:
          repository: NordicWayInterchange/interchange-swagger-docs
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: interchange-swagger-docs

      - name: Push swagger docs to github pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          cp /home/runner/work/interchange/interchange/onboard-server/target/swagger/swagger.json ./interchange-swagger-docs/swagger-onboard
          cp /home/runner/work/interchange/interchange/neighbour-server/target/swagger/swagger.json ./interchange-swagger-docs/swagger-neighbour
          cp /home/runner/work/interchange/interchange/napcore-server/target/swagger/swagger.json ./interchange-swagger-docs/swagger-napcore
          cp /home/runner/work/interchange/interchange/admin-server/target/swagger/swagger.json ./interchange-swagger-docs/swagger-admin
          cd interchange-swagger-docs
          git add --all
          git commit --allow-empty -m "Updated swagger.json"
          git push https://${{ secrets.REPO_ACCESS_TOKEN }}@github.com/NordicWayInterchange/interchange-swagger-docs.git --force
        working-directory: ./

      - name: checkout to client docs project
        uses: actions/checkout@v5
        with:
          repository: NordicWayInterchange/serviceprovider-client-documentation
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: serviceprovider-client-documentation

      - name: Push client docs to github pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          cd ./serviceprovider-client-documentation
          cp /home/runner/work/interchange/interchange/service-provider-client/target/generated-docs/*.html ./
          git add --all
          git commit --allow-empty -m "Updated html files"
          git push https://${{ secrets.REPO_ACCESS_TOKEN }}@github.com/NordicWayInterchange/serviceprovider-client-documentation.git --force
        working-directory: ./

      - name: checkout to interchange handbook project
        uses: actions/checkout@v5
        with:
          repository: NordicWayInterchange/interchange-handbook
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: interchange-handbook

      - name: Push user help to interchange handbook github pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          cd ./interchange-handbook
          cp /home/runner/work/interchange/interchange/frontend/public/generated/* ./generated/
          git add --all
          git commit --allow-empty -m "Updated generated files"
          git push https://${{ secrets.REPO_ACCESS_TOKEN }}@github.com/NordicWayInterchange/interchange-handbook.git --force
        working-directory: ./


  build-napcore:
    # Build each architecture natively instead of emulating arm64 via QEMU.
    # QEMU-emulated `npm ci`/`yarn install` can be 10-20x slower than native,
    # which was the real bottleneck in the pipeline (not the Maven build).
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Download persisted workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange
      - name: Tags to variables
        run: |
          echo "IMAGE_TAG=$(cat IMAGE_TAG.txt)" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=$(cat BRANCH_TAG.txt)" >> "$GITHUB_ENV"
      - name: Login to Github container registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: "Github Actions"
          password: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push the Docker image (native arch)
        run: |
          cd ./frontend
          docker buildx build --platform ${{ matrix.platform }} . \
            -t ghcr.io/nordicwayinterchange/napcore-frontend:${{ env.IMAGE_TAG }}-${{ matrix.suffix }} \
            --cache-from type=gha,scope=napcore-frontend-${{ matrix.suffix }} \
            --cache-to type=gha,mode=max,scope=napcore-frontend-${{ matrix.suffix }} \
            --push

  build-napcore-manifest:
    runs-on: ubuntu-latest
    needs: [build, build-napcore]
    defaults:
      run:
        shell: bash
    steps:
      - name: Download persisted workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange
      - name: Tags to variables
        run: |
          echo "IMAGE_TAG=$(cat IMAGE_TAG.txt)" >> "$GITHUB_ENV"
      - name: Login to Github container registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: "Github Actions"
          password: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/nordicwayinterchange/napcore-frontend:${{ env.IMAGE_TAG }} \
            ghcr.io/nordicwayinterchange/napcore-frontend:${{ env.IMAGE_TAG }}-amd64 \
            ghcr.io/nordicwayinterchange/napcore-frontend:${{ env.IMAGE_TAG }}-arm64

  build-admin-frontend:
    # Build each architecture natively instead of emulating arm64 via QEMU.
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Download persisted workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange
      - name: Tags to variables
        run: |
          echo "IMAGE_TAG=$(cat IMAGE_TAG.txt)" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=$(cat BRANCH_TAG.txt)" >> "$GITHUB_ENV"
      - name: Login to Github container registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: "Github Actions"
          password: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push the Docker image (native arch)
        run: |
          cd ./admin-frontend
          docker buildx build --platform ${{ matrix.platform }} . \
            -t ghcr.io/nordicwayinterchange/admin-frontend:${{ env.IMAGE_TAG }}-${{ matrix.suffix }} \
            --cache-from type=gha,scope=admin-frontend-${{ matrix.suffix }} \
            --cache-to type=gha,mode=max,scope=admin-frontend-${{ matrix.suffix }} \
            --push

  build-admin-frontend-manifest:
    runs-on: ubuntu-latest
    needs: [build, build-admin-frontend]
    defaults:
      run:
        shell: bash
    steps:
      - name: Download persisted workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange
      - name: Tags to variables
        run: |
          echo "IMAGE_TAG=$(cat IMAGE_TAG.txt)" >> "$GITHUB_ENV"
      - name: Login to Github container registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: "Github Actions"
          password: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/nordicwayinterchange/admin-frontend:${{ env.IMAGE_TAG }} \
            ghcr.io/nordicwayinterchange/admin-frontend:${{ env.IMAGE_TAG }}-amd64 \
            ghcr.io/nordicwayinterchange/admin-frontend:${{ env.IMAGE_TAG }}-arm64

  docker-push-svv:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        Images: [message-collector-app,neighbour-discoverer-app,neighbour-server-app,routing-configurer-app,onboard-server-app,napcore-server-app,service-provider-client,keys-generator, admin-server-app]
    defaults:
      run:
        shell: bash
    steps:
      - name: Download persisted workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange

      - name: Save tags to variables
        run: |
          echo "IMAGE_TAG=$(cat IMAGE_TAG.txt)" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=$(cat BRANCH_TAG.txt)" >> "$GITHUB_ENV"

      - name: Login to Github container registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: "Github Actions"
          password: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0
        with:
          cache-image: false


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: setup-buildx
        with:
          driver: docker-container
          name: buildx-${{ matrix.Images }}-${{ github.run_id }}

      - name: Build the Docker image
        run: |
          cd ./${{ matrix.Images }}          
          docker buildx build --builder ${{ steps.setup-buildx.outputs.name }}  --platform linux/amd64,linux/arm64 . -t ghcr.io/nordicwayinterchange/${{ matrix.Images }}:${{ env.IMAGE_TAG }} --build-arg JAR_VERSION=$(mvn org.apache.maven.plugins:maven-help-plugin:evaluate -Dexpression=project.version -q -DforceStdout) --push

