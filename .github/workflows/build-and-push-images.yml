name: Build and Push Docker Images

permissions:
  contents: read
  id-token: write

on:
  push:
  workflow_dispatch:
    inputs:
      git-ref:
        required: false
        description: 'Specified commit hash or branch name (Optional)'
jobs:
  validate-helm-chart:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Setup helm
        uses: azure/setup-helm@v4.3.1

      - name: Templating Interchange helm chart
        working-directory: ./helm/interchange
        run: helm template -f example_values.yml .

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore and save Maven cache
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven (compile, package and install, skip tests)
        run: mvn -B install -DskipTests -Dorg.slf4j.simpleLogger.log.org.apache.maven=warn

      - name: Save tags to files
        run: |
          echo "$(git rev-parse --short HEAD)" >> IMAGE_TAG.txt
          echo "$(git rev-parse --abbrev-ref HEAD)" >> BRANCH_TAG.txt
          mvn org.apache.maven.plugins:maven-help-plugin:evaluate -Dexpression=project.version -q -DforceStdout >> PROJECT_VERSION.txt

      - name: Persist workspace for downstream jobs
        uses: actions/upload-artifact@v7.0.0
        with:
          name: interchange
          path: |
            ./
            !./.git/**

  verify:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Each group runs 'mvn verify' only for its own modules, in parallel
        group:
          - name: neighbour-model
            modules: neighbour-model
          - name: neighbour-service
            modules: neighbour-service
          - name: napcore-server
            modules: napcore-server
          - name: routing-configurer
            modules: routing-configurer
          - name: jms-client
            modules: jms-client
          - name: qpid-client
            modules: qpid-client
          - name: onboard-server
            modules: onboard-server
          - name: admin-server
            modules: admin-server
          - name: neighbour-server
            modules: neighbour-server
          - name: neighbour-discoverer
            modules: neighbour-discoverer
          - name: rest
            modules: ssl-utils,testcontainers-base,api-model,interchange-spring-security,interchange-spring-security-client,neighbour-dns,dns-client,neighbour-rest-facade,message-collector,quadtree-tool,onboard-rest-api,onboard-server-app,message-collector-app,neighbour-discoverer-app,neighbour-server-app,routing-configurer-app,napcore-rest-api,napcore-server-app,napcore-rest-client,csr-signer,keys-generator,service-provider-client,admin-server-app,csr-generator,shared-api-model,local-delivery-service,import-application,export-application,local-subscription-service,match-service,service-provider-rest-client
    defaults:
      run:
        shell: bash
    steps:
      - name: Download persisted workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Maven cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install built reactor into local repo
        run: mvn -B install -DskipTests -q -Dorg.slf4j.simpleLogger.log.org.apache.maven=warn

      - name: Run integration tests with Maven (no clean)
        run: mvn -B verify -pl ${{ matrix.group.modules }} -Dorg.slf4j.simpleLogger.log.org.apache.maven=warn

      - name: Persist verified workspace
        uses: actions/upload-artifact@v7.0.0
        with:
          name: interchange-verified-${{ matrix.group.name }}
          path: |
            ./
            !./.git/**

  push-generated-docs:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/federation-master'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download verified workspaces (all groups, merged)
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: interchange-verified-*
          merge-multiple: true

      - name: Checkout to interchange-swagger-docs
        uses: actions/checkout@v5
        with:
          repository: NordicWayInterchange/interchange-swagger-docs
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: interchange-swagger-docs

      - name: Push swagger docs to github pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          cp /home/runner/work/interchange/interchange/onboard-server/target/swagger/swagger.json ./interchange-swagger-docs/swagger-onboard
          cp /home/runner/work/interchange/interchange/neighbour-server/target/swagger/swagger.json ./interchange-swagger-docs/swagger-neighbour
          cp /home/runner/work/interchange/interchange/napcore-server/target/swagger/swagger.json ./interchange-swagger-docs/swagger-napcore
          cp /home/runner/work/interchange/interchange/admin-server/target/swagger/swagger.json ./interchange-swagger-docs/swagger-admin
          cd interchange-swagger-docs
          git add --all
          git commit --allow-empty -m "Updated swagger.json"
          git push https://${{ secrets.REPO_ACCESS_TOKEN }}@github.com/NordicWayInterchange/interchange-swagger-docs.git --force
        working-directory: ./

      - name: Checkout to client docs project
        uses: actions/checkout@v5
        with:
          repository: NordicWayInterchange/serviceprovider-client-documentation
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: serviceprovider-client-documentation

      - name: Push client docs to github pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          cd ./serviceprovider-client-documentation
          cp /home/runner/work/interchange/interchange/service-provider-client/target/generated-docs/*.html ./
          git add --all
          git commit --allow-empty -m "Updated html files"
          git push https://${{ secrets.REPO_ACCESS_TOKEN }}@github.com/NordicWayInterchange/serviceprovider-client-documentation.git --force
        working-directory: ./

      - name: Checkout to interchange handbook project
        uses: actions/checkout@v5
        with:
          repository: NordicWayInterchange/interchange-handbook
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: interchange-handbook

      - name: Push user help to interchange handbook github pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          cd ./interchange-handbook
          cp /home/runner/work/interchange/interchange/frontend/public/generated/* ./generated/
          git add --all
          git commit --allow-empty -m "Updated generated files"
          git push https://${{ secrets.REPO_ACCESS_TOKEN }}@github.com/NordicWayInterchange/interchange-handbook.git --force
        working-directory: ./

  build-frontend-images:
    runs-on: ${{ matrix.arch.runner }}
    needs: build
    strategy:
      matrix:
        image:
          - name: napcore-frontend
            context: ./frontend
          - name: admin-frontend
            context: ./admin-frontend
        arch:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Download persisted workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange
      - name: Tags to variables
        run: |
          echo "IMAGE_TAG=$(cat IMAGE_TAG.txt)" >> "$GITHUB_ENV"

      - name: Login to Github container registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: "Github Actions"
          password: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.image.name }} (${{ matrix.arch.suffix }})
        working-directory: ${{ matrix.image.context }}
        run: |
          docker buildx build --platform ${{ matrix.arch.platform }} . \
            -t ghcr.io/nordicwayinterchange/${{ matrix.image.name }}:${{ env.IMAGE_TAG }}-${{ matrix.arch.suffix }} \
            --cache-from type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.suffix }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch.suffix }} \
            --push

  push-frontend-manifests:
    runs-on: ubuntu-latest
    needs: [build, build-frontend-images]
    strategy:
      matrix:
        image: [napcore-frontend, admin-frontend]
    defaults:
      run:
        shell: bash
    steps:
      - name: Download persisted workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange

      - name: Tags to variables
        run: |
          echo "IMAGE_TAG=$(cat IMAGE_TAG.txt)" >> "$GITHUB_ENV"

      - name: Login to Github container registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: "Github Actions"
          password: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Create and push multi-arch manifest for ${{ matrix.image }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/nordicwayinterchange/${{ matrix.image }}:${{ env.IMAGE_TAG }} \
            ghcr.io/nordicwayinterchange/${{ matrix.image }}:${{ env.IMAGE_TAG }}-amd64 \
            ghcr.io/nordicwayinterchange/${{ matrix.image }}:${{ env.IMAGE_TAG }}-arm64

  build-service-images:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        image:
          - message-collector-app
          - neighbour-discoverer-app
          - neighbour-server-app
          - routing-configurer-app
          - onboard-server-app
          - napcore-server-app
          - service-provider-client
          - keys-generator
          - admin-server-app
    defaults:
      run:
        shell: bash
    steps:
      - name: Download persisted workspace
        uses: actions/download-artifact@v8.0.1
        with:
          name: interchange

      - name: Tags to variables
        run: |
          echo "IMAGE_TAG=$(cat IMAGE_TAG.txt)" >> "$GITHUB_ENV"
          echo "PROJECT_VERSION=$(cat PROJECT_VERSION.txt)" >> "$GITHUB_ENV"

      - name: Login to Github container registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: "Github Actions"
          password: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.image }} (multi-arch)
        working-directory: ./${{ matrix.image }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 . \
            -t ghcr.io/nordicwayinterchange/${{ matrix.image }}:${{ env.IMAGE_TAG }} \
            --build-arg JAR_VERSION=${{ env.PROJECT_VERSION }} \
            --cache-from type=gha,scope=${{ matrix.image }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.image }} \
            --push


