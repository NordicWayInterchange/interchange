services:

# Note: now all the containers are on the same network - testing_net
# An idea for later would be to have two separate networks, one for each node,
# where the modules that need to communicate with each other are a part of both networks.

  mock-dns-server:
    build:
      context: ../fake-dns-server
      dockerfile: dns-dockerfile
    cap_add:
    - NET_ADMIN
    container_name: mock-dns-server
    hostname: mock-dns-server
    networks:
      testing_net:
        ipv4_address: 172.28.1.1
        aliases:
          - dns.bouvetinterchange.eu


  a_db:
    image: postgres:18.1
    container_name: a_db
    depends_on:
      - mock-dns-server
    ports:
      - 15432:5432
    environment:
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - POSTGRES_DB=federation
    networks:
    - testing_net


  a_admin:
    build:
      context: ../admin-server-app
    container_name: a_admin
    depends_on:
      - a_db
    links:
      - "a_qpid:a.bouvetinterchange.eu"
    ports:
      - 32665:8899
    volumes:
      - "systemtest-keys-volume:/keys"
    environment:
      - BASE_URL=https://a.bouvetinterchange.eu
      - BROKER_EXTERNAL_NAME=a.qpid.bouvetinterchange.eu
      - POSTGRES_URI=jdbc:postgresql://a_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - SERVER_NAME=a.bouvetinterchange.eu
      - DOMAIN_NAME=bouvetinterchange.eu
      - SP_CHNL_PORT=8899
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/a.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - ADMIN_NAME=admin.a.bouvetinterchange.eu
    networks:
      - testing_net

  a_onboard_server:
    #image: eu.gcr.io/nordic-way-aad182cc/onboard-server-app:${BRANCH_TAG}
    build:
      context: ../onboard-server-app
    container_name: a_onboard_server
    depends_on:
      - a_db
    ports:
      - 32666:8797
    volumes:
    - "systemtest-keys-volume:/keys"
    environment:
      - POSTGRES_URI=jdbc:postgresql://a_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - SERVER_NAME=a.bouvetinterchange.eu
      - DOMAIN_NAME=bouvetinterchange.eu
      - SP_CHNL_PORT=8797
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/a.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - BROKER_EXTERNAL_NAME=a.qpid.bouvetinterchange.eu
    networks:
      - testing_net

  a_napcore_server:
    build:
      context: ../napcore-server-app
    container_name: a_napcore_server
    depends_on:
      - a_db
    ports:
      - 32777:8898
    volumes:
      - "systemtest-keys-volume:/keys"
    environment:
      - POSTGRES_URI=jdbc:postgresql://a_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - SERVER_NAME=a.bouvetinterchange.eu
      - NAP_NAME=nap.a.bouvetinterchange.eu
      - DOMAIN_NAME=bouvetinterchange.eu
      - NAP_CHNL_PORT=8898
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/a.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - KEY_ALIAS=a.bouvetinterchange.eu
      - SIGN_STORE=/keys/ca.a.bouvetinterchange.eu.p12
      - SIGN_STORE_PASSWORD=password
      - SIGN_STORE_ALIAS=ca.a.bouvetinterchange.eu
      - BROKER_EXTERNAL_NAME=a.qpid.bouvetinterchange.eu
    networks:
      - testing_net

  a_qpid:
    image: apache/qpid-broker-j:10.0.1-alpine
    container_name: a_qpid
    ports:
      - 8666:8080
      - 443
      - 63003:5671
      - 5672
    volumes:
      - "../qpid/a:/qpid-broker-j/work-override"
      - "systemtest-keys-volume:/keys"
    environment:
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - INTERNAL_KEY_STORE=/keys/a_qpid.p12
      - INTERNAL_KEY_STORE_PASSWORD=password
      - KEY_STORE=/keys/a.qpid.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - GROUPS_FILE=/qpid-broker-j/work/groups
    depends_on:
    - mock-dns-server
    networks:
    - testing_net

  a_neighbour_server:
    #image: eu.gcr.io/nordic-way-aad182cc/neighbour-server-app:${BRANCH_TAG}
    build:
      context: ../neighbour-server-app
    container_name: a_neighbour_server
    depends_on:
      - a_db
    ports:
      - 8090
    volumes:
      - "systemtest-keys-volume:/keys"
    environment:
      - POSTGRES_URI=jdbc:postgresql://a_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - SERVER_NAME=a.bouvetinterchange.eu
      - DOMAIN_NAME=bouvetinterchange.eu
      - CTRL_CHNL_PORT=8090
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/a.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
    networks:
    - testing_net
    dns: 172.28.1.1

  a_routing_configurer:
    #image: eu.gcr.io/nordic-way-aad182cc/routing-configurer-app:${BRANCH_TAG}
    build:
      context: ../routing-configurer-app
    container_name: a_routing_configurer
    depends_on:
      - a_db
    volumes:
      - "systemtest-keys-volume:/keys"
    environment:
      - POSTGRES_URI=jdbc:postgresql://a_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - BASE_URL=https://a_qpid
      - SERVER_NAME=a.bouvetinterchange.eu
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/a.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - BROKER_EXTERNAL_NAME=a.qpid.bouvetinterchange.eu
    networks:
    - testing_net

  a_neighbour_discoverer:
    #image: eu.gcr.io/nordic-way-aad182cc/neighbour-discoverer-app:${BRANCH_TAG}
    build:
      context: ../neighbour-discoverer-app
    container_name: a_neighbour_discoverer
    depends_on:
      - a_db
    links:
     - "b_neighbour_server:b.bouvetinterchange.eu"
    volumes:
      - "systemtest-keys-volume:/keys"
    environment:
      - POSTGRES_URI=jdbc:postgresql://a_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - SERVER_NAME=a.bouvetinterchange.eu
      - DOMAIN_NAME=bouvetinterchange.eu
      - CTRL_CHNL_PORT=8090
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/a.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - BROKER_EXTERNAL_NAME=a.qpid.bouvetinterchange.eu
    dns: 172.28.1.1
    networks:
    - testing_net

  a_message_collector_app:
    #image: eu.gcr.io/nordic-way-aad182cc/message-collector-app:${BRANCH_TAG}
    build:
      context: ../message-collector-app
    container_name: a_message_collector_app
    depends_on:
    - a_db
    links:
    - "a_qpid:a.qpid.bouvetinterchange.eu"
    - "b_qpid:b.qpid.bouvetinterchange.eu"
    volumes:
    - "systemtest-keys-volume:/keys"
    environment:
    - POSTGRES_URI=jdbc:postgresql://a_db:5432/federation
    - POSTGRES_USER=federation
    - POSTGRES_PASSWORD=federation
    - KEY_STORE=/keys/a.bouvetinterchange.eu.p12
    - KEY_STORE_PASSWORD=password
    - KEY_STORE_TYPE=PKCS12
    - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
    - TRUST_STORE_PASSWORD=password
    - TRUST_STORE_TYPE=JKS
    - SERVER_NAME=a.bouvetinterchange.eu
    - BROKER_EXTERNAL_NAME=a.qpid.bouvetinterchange.eu
    - PREFETCH=1000
    networks:
    - testing_net

  b_db:
    image: postgres:15.1
    container_name: b_db
    depends_on:
    - mock-dns-server
    ports:
      - 25432:5432
    environment:
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - POSTGRES_DB=federation
    networks:
    - testing_net

  b_admin:
    build:
      context: ../admin-server-app
    container_name: b_admin
    depends_on:
      - b_db
    links:
      - "b_qpid:b.bouvetinterchange.eu"
    ports:
      - 32667:8899
    volumes:
      - "systemtest-keys-volume:/keys"
    environment:
      - BASE_URL=https://b.bouvetinterchange.eu
      - BROKER_EXTERNAL_NAME=b.qpid.bouvetinterchange.eu
      - POSTGRES_URI=jdbc:postgresql://b_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - SERVER_NAME=b.bouvetinterchange.eu
      - DOMAIN_NAME=bouvetinterchange.eu
      - SP_CHNL_PORT=8899
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/b.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - ADMIN_NAME=admin.b.bouvetinterchange.eu
    networks:
      - testing_net

  b_onboard_server:
    #image: eu.gcr.io/nordic-way-aad182cc/onboard-server-app:${BRANCH_TAG}
    build:
      context: ../onboard-server-app
    container_name: b_onboard_server
    depends_on:
    - b_db
    ports:
    - 32555:8696
    volumes:
    - "systemtest-keys-volume:/keys"
    environment:
    - POSTGRES_URI=jdbc:postgresql://b_db:5432/federation
    - POSTGRES_USER=federation
    - POSTGRES_PASSWORD=federation
    - SERVER_NAME=b.bouvetinterchange.eu
    - DOMAIN_NAME=bouvetinterchange.eu
    - SP_CHNL_PORT=8696
    - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
    - TRUST_STORE_PASSWORD=password
    - KEY_STORE=/keys/b.bouvetinterchange.eu.p12
    - KEY_STORE_PASSWORD=password
    - BROKER_EXTERNAL_NAME=b.qpid.bouvetinterchange.eu
    networks:
    - testing_net

  b_neighbour_server:
    #image: eu.gcr.io/nordic-way-aad182cc/neighbour-server-app:${BRANCH_TAG}
    build:
      context: ../neighbour-server-app
    container_name: b_neighbour_server
    depends_on:
      - b_db
    ports:
      - 8090
    volumes:
      - "systemtest-keys-volume:/keys"
    environment:
      - POSTGRES_URI=jdbc:postgresql://b_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - SERVER_NAME=b.bouvetinterchange.eu
      - DOMAIN_NAME=bouvetinterchange.eu
      - CTRL_CHNL_PORT=8090
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/b.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
    networks:
      - testing_net
    dns: 172.28.1.1

  b_neighbour_discoverer:
    #image: eu.gcr.io/nordic-way-aad182cc/neighbour-discoverer-app:${BRANCH_TAG}
    build:
      context: ../neighbour-discoverer-app
    container_name: b_neighbour_discoverer
    depends_on:
      - b_db
    links:
      - "a_neighbour_server:a.bouvetinterchange.eu"
    volumes:
      - "systemtest-keys-volume:/keys"
    environment:
      - POSTGRES_URI=jdbc:postgresql://b_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - SERVER_NAME=b.bouvetinterchange.eu
      #- NODE_PROVIDER_NAME=b.bouvetinterchange.eu # "my name"
      - DOMAIN_NAME=bouvetinterchange.eu
      - CTRL_CHNL_PORT=8090
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/b.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - BROKER_EXTERNAL_NAME=b.qpid.bouvetinterchange.eu
    networks:
    - testing_net
    dns: 172.28.1.1

  b_qpid:
    image: apache/qpid-broker-j:10.0.1-alpine
    container_name: b_qpid
    ports:
      - 8555:8080
      - 443
      - 63001:5671
      - 5672
    volumes:
      - "../qpid/b:/qpid-broker-j/work-override"
      - "systemtest-keys-volume:/keys"
    environment:
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/b.qpid.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - INTERNAL_KEY_STORE=/keys/b_qpid.p12
      - INTERNAL_KEY_STORE_PASSWORD=password
      - GROUPS_FILE=/qpid-broker-j/work/groups
    depends_on:
    - mock-dns-server
    networks:
    - testing_net

  b_routing_configurer:
    #image: eu.gcr.io/nordic-way-aad182cc/routing-configurer-app:${BRANCH_TAG}
    build:
      context: ../routing-configurer-app
    container_name: b_routing_configurer
    depends_on:
      - b_db
    volumes:
      - "systemtest-keys-volume:/keys"
    environment:
      - POSTGRES_URI=jdbc:postgresql://b_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - BASE_URL=https://b_qpid
      - SERVER_NAME=b.bouvetinterchange.eu
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - KEY_STORE=/keys/b.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - BROKER_EXTERNAL_NAME=b.qpid.bouvetinterchange.eu

    networks:
    - testing_net

  b_message_collector_app:
    #image: eu.gcr.io/nordic-way-aad182cc/message-collector-app:${BRANCH_TAG}
    build:
      context: ../message-collector-app
    container_name: b_message_collector_app
    depends_on:
      - b_db
    links:
      - "a_qpid:a.qpid.bouvetinterchange.eu"
      - "b_qpid:b.qpid.bouvetinterchange.eu"
    volumes:
      - "systemtest-keys-volume:/keys"
    environment:
      - POSTGRES_URI=jdbc:postgresql://b_db:5432/federation
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation
      - KEY_STORE=/keys/b.bouvetinterchange.eu.p12
      - KEY_STORE_PASSWORD=password
      - KEY_STORE_TYPE=PKCS12
      - TRUST_STORE=/keys/ca.bouvetinterchange.eu.jks
      - TRUST_STORE_PASSWORD=password
      - TRUST_STORE_TYPE=JKS
      - SERVER_NAME=b.bouvetinterchange.eu
      - BROKER_EXTERNAL_NAME=b.qpid.bouvetinterchange.eu
      - PREFETCH=1000
    networks:
    - testing_net

networks:
  testing_net:
    ipam:
      driver: default
      config:
      - subnet: 172.28.0.0/16

volumes:
  systemtest-keys-volume:
    external: true

