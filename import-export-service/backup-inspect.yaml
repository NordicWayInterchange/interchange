apiVersion: v1
kind: Pod
metadata:
  name: backup-inspect
spec:
  restartPolicy: Never
  containers:
    - name: inspector
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - name: db-backup
          mountPath: /backup
  volumes:
    - name: db-backup
      persistentVolumeClaim:
        claimName: db-backup-pvc-2
